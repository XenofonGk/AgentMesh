name: CI

on:
  push:
    branches: [main]
  pull_request:

# Fork PRs get a read-only token and no secrets (PLAN.md §5, Phase 6).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scan covers every commit on the branch, not just the tip.
          fetch-depth: 0

      # Blocking, deliberately: gitleaks has near-zero false positives, and a miss is
      # unrecoverable — a leaked key is public the moment it is pushed.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: pnpm audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Advisory, not blocking. A gate that fails on unfixable transitive advisories
      # teaches contributors to bypass CI, and that habit costs more on a
      # security-sensitive project than the advisories themselves. The weekly run
      # (audit-weekly.yml) is what actually surfaces these, as a tracked issue.
      - name: Audit dependencies
        continue-on-error: true
        run: pnpm audit --audit-level high

  compose:
    name: docker compose build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: POSTGRES_PASSWORD=ci-only-not-a-real-secret docker compose build
